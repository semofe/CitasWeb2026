# Proyecto SonarQube: backend Node.js / Express
sonar.projectKey=citasweb2026
sonar.projectName=CitasWeb2026
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Código y pruebas que se analizarán: backend completo.
sonar.sources=backend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.js
sonar.exclusions=backend/coverage/**,backend/node_modules/**

# Cobertura generada por: cd backend && npm run test:coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
